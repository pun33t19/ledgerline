name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install
        run: uv sync --locked
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: test
        run: make test
      - name: fixtures are reproducible
        run: make fixtures-check
      - name: dependency audit
        run: make vuln

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: uv sync --locked && cd web && npm ci
      - name: types match the Python API, lint, type check, unit tests, build
        run: make web-ci
      - name: npm audit
        run: cd web && npm audit --audit-level=high
      - name: browser tests (Playwright)
        run: cd web && npx playwright install --with-deps chromium && npm run e2e
