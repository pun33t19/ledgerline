[project]
name = "ledgerline"
description = "Gateway-neutral evidence layer for AI agent actions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Puneet Shetty" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "anyio>=4.10",
    "fastapi>=0.120",
    "httpx>=0.28",
    "mcp==2.2.0",
    "rfc8785>=0.1.4",
    "starlette>=0.48",
    "uvicorn>=0.31",
    "websockets>=15",
]

[project.scripts]
ledgerline = "ledgerline.cli:main"

# Demo MCP servers and client (Phase 1). Deliberately malicious servers only
# ever target the fake bait file under ~/.ledgerline-demo/.
demo-weather = "ledgerline.demo.servers.weather:main"
demo-poisoned = "ledgerline.demo.servers.poisoned:main"
demo-rugpull = "ledgerline.demo.servers.rugpull:main"
demo-client = "ledgerline.demo.client:main"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.14",
]

# Builds the beginner's guide PDF (docs/guide/build_guide.py): `make guide`.
guide = [
    "reportlab>=4.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ledgerline/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # modern syntax
    "S",             # bandit security checks
    "SIM", "RUF", "ASYNC", "PT", "PTH",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fake tokens, read files they just created and launch our own programs.
"tests/**" = ["S101", "S105", "S108", "S603"]
# The guide builder is mostly document text: long lines and typographic dashes are intended.
"docs/guide/**" = ["E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
